name: check
# Fast sanity checks, so a typo doesn't ship in an image and break lupi.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell scripts pass shellcheck
        run: shellcheck -S warning files/scripts/*.sh files/system/usr/bin/* files/system/usr/libexec/* files/system/etc/profile.d/*.sh files/system/usr/lib/NetworkManager/dispatcher.d/* tests/boot/*.sh iso/anaconda/online/*.sh

      # systemd services (lupios-kargs) and NetworkManager's dispatcher (network trust) start lupi
      # with almost no environment: no $HOME, no $USER. With `set -u`, anything at the top of the
      # script that needs them would stop it before it does anything.
      - name: lupi starts without $HOME, like systemd and NetworkManager run it
        run: env -i PATH=/usr/bin:/bin bash files/system/usr/bin/lupi help >/dev/null

      - name: Artwork is up to date with art/generate.mjs
        run: |
          node art/generate.mjs
          git diff --exit-code -- files/system/usr/share/lupios/art files/system/usr/share/lupios/fastfetch-logo.txt art/preview.html iso/anaconda website/src/assets website/public/favicon.svg

      - name: No Windows line endings
        run: |
          if grep -rlI $'\r' files lab recipes website/src website/scripts; then
            echo "::error::The files above have CRLF line endings"
            exit 1
          fi
