name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation or the website has changed
      - "**.md"
      - "website/**"
      - ".impeccable/**" # the website's design notes (DESIGN.md's sidecar, page briefs)
      - ".github/workflows/website.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - "iso/**" # the installer's look and the online installer: build-iso.yml, not the image
      - ".github/workflows/build-iso.yml"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml # lupios: AMD/Intel graphics and VMs
          - recipe-nvidia.yml # lupios-nvidia: NVIDIA graphics
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

          # Repack the finished image by package (Fedora's rpm-ostree compose build-chunked-oci).
          # Without it, every daily rebuild recreated LupiOS's layers from scratch, so each update
          # downloaded ~535 MB even when nothing had changed. Now identical contents give identical
          # pieces, and an update only downloads what really changed. Slower builds.
          build_chunked_oci: true
          # Normally each build reuses the previous build's layer layout (smaller updates). For the
          # NVIDIA image that crashes rpm-ostree on every build after the first (an assertion in
          # ostree-ext's chunking.rs, October 2026), so it plans its layout from scratch instead.
          rechunk_clear_plan: ${{ matrix.recipe == 'recipe-nvidia.yml' }}

  # GitHub only runs scheduled workflows on the default branch, so without this the testing channel
  # would only get Fedora's security fixes when someone pushes to testing. The daily run starts a
  # testing build too. workflow_dispatch is the one event GITHUB_TOKEN may start.
  testing:
    name: Start the testing build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref testing
        env:
          GH_TOKEN: ${{ github.token }}

  # The Fedora version, read from the recipe: BlueBuild names branch images br-<branch>-<version>, so
  # the boot test and the testing tag below need it. image-version stays the one place to change it.
  version:
    name: Read the Fedora version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fedora: ${{ steps.read.outputs.fedora }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          v=$(sed -n 's/^image-version: *\([0-9][0-9]*\).*/\1/p' recipes/recipe.yml)
          n=$(sed -n 's/^image-version: *\([0-9][0-9]*\).*/\1/p' recipes/recipe-nvidia.yml)
          [[ -n $v ]] || { echo "No image-version in recipes/recipe.yml" >&2; exit 1; }
          [[ $v == "$n" ]] || { echo "recipe.yml builds Fedora $v, recipe-nvidia.yml Fedora $n: make them match" >&2; exit 1; }
          echo "fedora=$v" >> "$GITHUB_OUTPUT"

  # Boot the images just pushed in a virtual machine and check them from inside (boot-test.yml).
  # The VM can't use the NVIDIA driver, but everything else in the NVIDIA image (what the owner's own
  # PC runs) is checked the same way. Both run side by side, even when a build failed, so one
  # flavour's failure doesn't hide the other's result (a failed build re-tests the previous image).
  # Pull requests push no image: skipped.
  boot-test:
    name: Boot test
    needs: [bluebuild, version]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        image: [lupios, lupios-nvidia]
    permissions:
      contents: read
    uses: ./.github/workflows/boot-test.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name == 'main' && 'latest' || format('br-{0}-{1}', github.ref_name, needs.version.outputs.fedora) }}

  # The testing channel (lupi channel testing) follows the tag `testing`, which has no Fedora version
  # in it: installs keep getting updates when testing moves to the next Fedora. It only moves after
  # both images passed the boot test, so the testing channel never gets a build that didn't boot. A
  # newer testing build can't have replaced br-testing-<version> in the meantime: starting one
  # cancels this run (concurrency above).
  channel-tag:
    name: Move the testing tag
    needs: [version, boot-test]
    if: github.ref_name == 'testing' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: [lupios, lupios-nvidia]
    steps:
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.fedora }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          skopeo login ghcr.io -u "$ACTOR" --password-stdin <<<"$TOKEN"
          # Same manifest, new name: the signature is stored by digest, so it covers the new tag too
          skopeo copy --all --preserve-digests "docker://$IMAGE:br-testing-$VERSION" "docker://$IMAGE:testing"
          a=$(skopeo inspect --raw "docker://$IMAGE:br-testing-$VERSION" | sha256sum)
          b=$(skopeo inspect --raw "docker://$IMAGE:testing" | sha256sum)
          [[ $a == "$b" ]] || { echo "testing doesn't point at br-testing-$VERSION" >&2; exit 1; }
          echo "$IMAGE:testing = br-testing-$VERSION (sha256:${a%% *})"
