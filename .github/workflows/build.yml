name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation or the website has changed
      - "**.md"
      - "website/**"
      - ".github/workflows/website.yml"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml # lupios: AMD/Intel graphics and VMs
          - recipe-nvidia.yml # lupios-nvidia: NVIDIA graphics
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

          # Repack the finished image by package (Fedora's rpm-ostree compose build-chunked-oci).
          # Without it, every daily rebuild recreated LupiOS's layers from scratch, so each update
          # downloaded ~535 MB even when nothing had changed. Now identical contents give identical
          # pieces, and an update only downloads what really changed. Slower builds.
          build_chunked_oci: true
