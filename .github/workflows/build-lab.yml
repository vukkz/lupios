name: build-lab
on:
  schedule:
    - cron: "30 6 * * 1" # every Monday, to pick up new Kali tool versions
  push:
    branches: [main]
    paths:
      - "lab/**"
      - ".github/workflows/build-lab.yml"
  pull_request:
    paths:
      - "lab/**"
      - ".github/workflows/build-lab.yml"
  workflow_dispatch: # allow manually triggering builds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lupios-lab

jobs:
  build:
    name: Build Lupi Lab
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Free disk space # the Kali tools are several GB
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: lab
          file: lab/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image # same key as the OS image (cosign.pub in the repo root)
        # The push is a list (the amd64 image plus build provenance). podman checks the signature of the
        # image it actually pulls, not the list, so --recursive signs both.
        # cosign 3 signs in a new bundle format by default, which podman can't find: these two flags keep
        # the classic sha256-<digest>.sig tag that podman (and the OS image's own signature) use.
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --recursive --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
