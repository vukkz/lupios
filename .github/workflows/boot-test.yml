name: boot-test
# Boots a LupiOS image in a virtual machine and checks it from inside (tests/boot/checks.sh),
# so an image that doesn't start, or starts with something broken, is caught before anyone
# updates to it. build.yml runs it after every image build; it can also be run by hand
# (Actions tab > boot-test > Run workflow) for any image.
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image:
        description: Image to test
        default: ghcr.io/vukkz/lupios:br-testing-44

permissions:
  contents: read

jobs:
  boot:
    name: Boot and check ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ${{ inputs.image }}
      WORK: /mnt/boot-test # the runner's second disk has the room for a 20 GB test disk
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space # the image unpacks to well over 10 GB
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          df -h / /mnt

      - name: Let QEMU use KVM # hardware virtualisation: without it the VM would be far too slow
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf

      - name: Install the image to a disk
        # LupiOS's own bootc installs it, the same way the installer does. The extra kernel
        # arguments only exist on this test disk: a serial console for the log, the checks
        # unit, and no Flatpak downloads (Firefox) that would slow the test down.
        run: |
          sudo podman pull "$IMAGE"
          truncate -s 20G "$WORK/disk.raw"
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers -v /dev:/dev -v "$WORK:/output" \
            "$IMAGE" \
            bootc install to-disk --via-loopback --generic-image --wipe --filesystem btrfs \
              --karg console=ttyS0,115200n8 \
              --karg systemd.wants=lupios-ci.service \
              --karg systemd.mask=lupios-default-apps.timer \
              /output/disk.raw
          ls -lsh "$WORK/disk.raw"

      - name: Boot it and run the checks
        # The checks reach the VM as systemd credentials, so the image itself stays untouched.
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd "$WORK/vars.fd"
          unit=$(base64 -w0 tests/boot/lupios-ci.service)
          set +e
          timeout 1500 qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -smp 2 -m 4096 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file="$WORK/vars.fd" \
            -drive file="$WORK/disk.raw",format=raw,if=virtio \
            -nic user,model=virtio-net-pci \
            -vga virtio -display none \
            -serial file:"$WORK/serial.log" \
            -smbios type=11,value=io.systemd.credential.binary:systemd.extra-unit.lupios-ci.service="$unit" \
            -fw_cfg name=opt/io.systemd.credentials/lupios-ci.checks,file=tests/boot/checks.sh
          echo "QEMU exited with $?"
          set -e
          grep -a "LUPIOS-CI" "$WORK/serial.log" || true
          if ! grep -aq "LUPIOS-CI: PASS" "$WORK/serial.log"; then
            echo "::error::The boot test did not pass. The last lines of the VM's console:"
            tail -n 80 "$WORK/serial.log"
            exit 1
          fi

      - name: Keep the VM's console log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-test-serial-log
          path: /mnt/boot-test/serial.log
          if-no-files-found: ignore
          retention-days: 14
