name: build-iso
# Builds the LupiOS installer ISOs (for a USB stick), normally from the stable (`latest`) images:
# lupios.iso and lupios-nvidia.iso hold the whole OS, lupios-online.iso downloads it during setup.
# Run it by hand: Actions tab > build-iso > Run workflow (or: gh workflow run build-iso.yml).
# It takes 30-60 minutes. The ISOs appear as downloads at the bottom of the run's page.
on:
  workflow_dispatch:
    inputs:
      flavour:
        description: Which ISO to build
        type: choice
        options: [all, lupios, lupios-nvidia, lupios-online]
        default: all
      channel:
        description: Which images to package (testing = not promoted yet, for trying out in a VM)
        type: choice
        options: [stable, testing]
        default: stable

jobs:
  iso:
    name: ISO ${{ matrix.iso }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { iso: lupios, image: lupios }
          - { iso: lupios-nvidia, image: lupios-nvidia }
          # One small ISO for every PC, without a copy of LupiOS: the installer picks the version
          # for the PC and downloads it (iso/anaconda/lupios-online.tmpl). The builder still packs
          # an image, which the "Remove the OS image" step takes out again.
          - { iso: lupios-online, image: lupios, online: true }
    env:
      WANTED: ${{ inputs.flavour == 'all' || inputs.flavour == matrix.iso }}
      FEDORA_VERSION: 44 # keep in sync with image-version in recipes/
    steps:
      - name: Free disk space # the ISO holds the whole OS image
        if: env.WANTED == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # The installer runs on Fedora's packages, which brand it as Fedora. Our look for it lives in
      # iso/anaconda: render its artwork here, then lupios-look.tmpl swaps it in during the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.WANTED == 'true'
      - name: Render the installer artwork
        if: env.WANTED == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends librsvg2-bin fonts-dejavu-core
          mkdir -p iso/anaconda/build
          for svg in iso/anaconda/*.svg; do
            rsvg-convert "$svg" -o "iso/anaconda/build/$(basename "${svg%.svg}").png"
          done
          ls -l iso/anaconda/build

      - name: Build ISO
        if: env.WANTED == 'true'
        id: build
        uses: jasonn3/build-container-installer@bed71f841c250650a70f1ed8315ba92da1591ba6 # v1.5.0
        with:
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_name: ${{ matrix.image }}
          # an install from a testing ISO stays on the testing channel (lupi channel stable switches)
          image_tag: ${{ inputs.channel == 'testing' && format('br-testing-{0}', env.FEDORA_VERSION) || 'latest' }}
          version: ${{ env.FEDORA_VERSION }}
          variant: Kinoite
          iso_name: ${{ matrix.iso }}.iso # lupios.iso: no Fedora version in the name, the OS updates continuously
          # Enroll Universal Blue's Secure Boot key during install, so drivers it signs
          # (like NVIDIA's) load with Secure Boot on. The installed PC asks for this
          # password once, on a blue "MOK management" screen after the first reboot.
          secure_boot_key_url: https://github.com/ublue-os/akmods/raw/main/certs/public_key.der
          enrollment_password: universalblue
          # the repo, inside the builder (space-separated)
          additional_templates: >-
            /github/workspace/iso/anaconda/lupios-look.tmpl
            ${{ matrix.online && '/github/workspace/iso/anaconda/lupios-online.tmpl' || '' }}

      - name: Remove the OS image from the online ISO
        if: env.WANTED == 'true' && matrix.online
        env:
          ISO: ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          sudo apt-get install -y -q --no-install-recommends xorriso isomd5sum
          # The builder put the image in a folder named after it (/lupios, an OCI layout). Write a copy
          # without it, keeping the boot setup, the same way the builder adds files to Fedora's ISO.
          sudo xorriso -indev "$ISO" -outdev "$ISO.online" -boot_image any replay -rm_r "/$IMAGE" --
          sudo mv -f "$ISO.online" "$ISO"
          sudo implantisomd5 --force "$ISO" # the installer's "check this media" test
          cd "$(dirname "$ISO")"
          sha256sum "$(basename "$ISO")" | sudo tee "$(basename "$ISO")-CHECKSUM"
          ls -l "$(basename "$ISO")"

      # The website's download buttons point here (website/src/downloads.ts). Only stable ISOs go
      # public. Needs two repo settings, or the step is skipped: the secret SF_SSH_KEY (the private
      # half of an upload key the owner added to their SourceForge account) and the variable SF_USER.
      - name: Publish on SourceForge
        if: env.WANTED == 'true' && inputs.channel == 'stable' && vars.SF_USER != ''
        env:
          SF_USER: ${{ vars.SF_USER }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          ISO: ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
        run: |
          install -d -m 700 ~/.ssh
          # tr: the key may have been pasted with Windows line endings
          printf '%s\n' "$SF_SSH_KEY" | tr -d '\r' > ~/.ssh/sourceforge
          chmod 600 ~/.ssh/sourceforge
          # SourceForge's upload server key, checked against the fingerprint SourceForge publishes
          # (SHA256:209BDmH3jsRyO9UeGPPgLWPSegKmYCBIya0nR/AWWCY): an impostor server gets nothing.
          echo "frs.sourceforge.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOQD35Ujalhh+JJkPvMckDlhu4dS7WH6NsOJ15iGCJLC" > ~/.ssh/known_hosts
          # rsync uploads to a temporary name and renames at the end, so mirrors never see half an ISO.
          # The ISO goes first, then its checksum.
          rsync -v -e "ssh -i $HOME/.ssh/sourceforge -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            "$ISO" "$ISO-CHECKSUM" "$SF_USER@frs.sourceforge.net:/home/frs/project/lupios/"
          rm -f ~/.ssh/sourceforge

      - name: Upload ISO
        if: env.WANTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.iso }}-iso
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
