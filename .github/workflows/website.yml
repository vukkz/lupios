name: website
# Builds the website (website/) and publishes it on GitHub Pages: https://vukkz.github.io/lupios
# It runs on every push to `main` and `testing`, whatever changed: the "What's new" page lists the
# branch's commits. Pull requests only when the site or a doc it copies (SECURITY.md, docs/*.md)
# changes. Only `main` publishes; elsewhere it just checks that the site builds.
on:
  push:
    branches: [main, testing]
  pull_request:
    paths:
      - "website/**"
      - "SECURITY.md"
      - "docs/*.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency: # one publish at a time, and never cut one off halfway
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: scripts/changes.mjs makes the "What's new" page from it
      - uses: withastro/action@v6 # installs, runs `npm run build`, packages dist/ for Pages
        with:
          path: website

  publish:
    name: Publish on GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
