# LupiOS security level: wolf. Ignore the DNS servers networks hand out, so every
# lookup uses the encrypted resolver from resolved.conf instead.
[main]
dns=none
# NetworkManager also hands each network's DNS servers to systemd-resolved, even with dns=none, and
# resolved would then send lookups to them too (found by the boot test, 2026-10-07). Not on wolf.
systemd-resolved=false
