# LupiOS: leave the open-source NVIDIA drivers out of the boot image (initramfs). nouveau pulled in
# ~106 MB of NVIDIA firmware, re-downloaded with every kernel update and stored again in /boot for
# each kept system version. In lupios-nvidia nouveau is switched off anyway; in lupios it's only for
# NVIDIA cards from 2018 on, which belong on lupios-nvidia (older cards don't use this firmware).
# Such a card still gets nouveau a moment later, from the disk: only the disk-password screen before
# it uses the basic firmware display. nova_core/nova_drm (the kernel's newer NVIDIA driver) use the
# same firmware.
omit_drivers+=" nouveau nova_core nova_drm "
