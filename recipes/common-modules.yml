---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Everything LupiOS adds on top of its base image. Shared by every flavour
# (recipe.yml, recipe-nvidia.yml), so edit here and all of them change.
modules:
  # rpm records each package's install time in its database, so the database came out different in
  # every daily build, and every update downloaded it again (~77 MB) even when no package changed. With
  # SOURCE_DATE_EPOCH set, rpm records this fixed time instead (2026-01-01; any fixed date works). An
  # ARG is visible to the steps below but isn't stored in the image, and it doesn't change the image's
  # own date (buildah only uses its --source-date-epoch flag for that). layers.sh prints fingerprints.
  - type: containerfile
    snippets:
      - ARG SOURCE_DATE_EPOCH=1767225600

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - distrobox # runs the Lupi Lab container (lupi lab) and the tools box (lupi install)
        - jq # used by lupi-security-check
        - usbguard # off by default, turned on with lupi usbguard on (or the wolf level)
        - gamemode # host daemon that Steam's gamemoderun talks to
        - fastfetch # system info with the wolf logo
        - dejavu-sans-mono-fonts # has the Braille dots the terminal logo is drawn with
        - librsvg2-tools # rsvg-convert, turns the SVG artwork into PNGs in look.sh
        - steam-devices # controller/VR rules; Flatpak Steam can't install them itself
        - libnotify # notify-send, for the "new network" message from lupi
    remove:
      packages:
        # removing firefox (in favor of the flatpak, which is sandboxed)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks
        # KDE's wallpaper collection (256 MB, already-compressed pictures, so ~250 MB of every download
        # and ISO): LupiOS ships its own, and more are one click away in "Get New Wallpapers". Nothing
        # depends on it (checked 2026-10-09).
        - plasma-workspace-wallpapers
        # NOT Fedora's own wallpapers (desktop-backgrounds-kde, f44-backgrounds-*): kde-settings-plasma
        # needs what they provide, so dnf also removed plasma-workspace, plasma-desktop and the login
        # manager with them (2026-10-09, caught by the boot test). desktop-intact.sh now stops such a build.
        # Amazon AWS's Python SDK (~120 MB), only recommended by sos (support reports) to upload to S3
        - python3-boto3
        - python3-botocore

  # Firefox and Flatseal (Flatpaks) are installed once on the first start by lupios-default-apps.timer,
  # not by BlueBuild's default-flatpaks: that one re-installs them on every boot (so removing one
  # never sticks) and notifies at every login.

  - type: script
    scripts:
      - desktop-intact.sh # first: stops the build if the dnf module took part of the desktop with it
      - branding.sh
      - firewall.sh
      - opensnitch.sh # per-app firewall for `lupi outgoing`, off by default
      - look.sh
      - debrand.sh
      - fix-permissions.sh

  - type: systemd
    system:
      enabled:
        - lupios-kargs.timer # adds the kernel hardening boot arguments once, after install
        - lupios-default-apps.timer # installs Firefox and Flatseal once, on the first start

  # Rebuild the boot image so it contains the LupiOS boot screen and the module
  # blacklist. Keep this near the end so it includes everything above.
  - type: initramfs

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

  # lab-signature.sh: podman only accepts a Lupi Lab image signed by LupiOS. It builds on the OS
  # image's rule, which the signing module above writes.
  # layers.sh: smaller updates, by giving files that change for different reasons their own layers.
  # BlueBuild copies nushell into the image because its dnf and script modules run on it. Nothing
  # needs it once the build is done, and it would ship ~190 MB (unpacked) to every user. script@v1
  # is the plain-shell version of the script module, so this doesn't delete what runs it.
  - type: script@v1
    scripts:
      - lab-signature.sh
      - layers.sh
    snippets:
      - rm -rf /usr/libexec/bluebuild
