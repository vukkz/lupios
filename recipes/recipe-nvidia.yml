---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# LupiOS for NVIDIA graphics. Identical to recipe.yml except for the base image,
# which adds NVIDIA's driver (built and signed for every kernel by Universal Blue).
name: lupios-nvidia
description: LupiOS (NVIDIA) - a hardened, rollback-safe everyday desktop, with Kali's hacking tools one command away.

base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 44 # keep in sync with recipe.yml
# BlueBuild would also copy its own CLI and cosign into the image: build tools no LupiOS user needs
blue-build-tag: none
cosign-version: none

modules:
  - from-file: common-modules.yml
